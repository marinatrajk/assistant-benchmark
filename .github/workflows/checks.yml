name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python scripts/check_public_files.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-skills
          path: artifacts/

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:ui
      - run: npm run test:site

  macos-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile desktop helper without running desktop actions
        run: xcrun swiftc -O harness/native/desktop.swift -o /tmp/assistant-benchmark-desktop
